server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro i18n: default locale is `en`, served at `/`.
    # Static assets: long cache.
    location ~* \.(js|css|svg|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML: no cache (so deploys are seen immediately).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
